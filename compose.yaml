services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://sisgep:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/sisgep
      MEDIA_ROOT: /data/media
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      USE_CLOUDINARY: ${USE_CLOUDINARY:-False}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      USE_BREVO: ${USE_BREVO:-False}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-SISGEP <sisgepgestao@gmail.com>}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_media:/data/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sisgep
      POSTGRES_USER: sisgep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisgep -d sisgep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_media:
  postgres_data:
